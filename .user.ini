; UA: Ліміти та приховування попереджень PHP для PHP-FPM / CGI. Для mod_php див. .htaccess.
; EN: Limits and hiding of PHP warnings for PHP-FPM / CGI. For mod_php see .htaccess.
display_errors = Off
display_startup_errors = Off
log_errors = On
upload_max_filesize = 200M
post_max_size = 220M
max_file_uploads = 20
max_execution_time = 300
memory_limit = 256M
